[project]
name = "hotmemory"
version = "0.1.0"
description = "Agent memory as tables on Hotdata"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hotdata" }]
keywords = ["agent", "memory", "llm", "hotdata", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hotdata-dev/hotmemory"
Documentation = "https://github.com/hotdata-dev/hotmemory/tree/main/docs"
Changelog = "https://github.com/hotdata-dev/hotmemory/blob/main/CHANGELOG.md"
Issues = "https://github.com/hotdata-dev/hotmemory/issues"

[project.optional-dependencies]
hotdata = ["hotdata-framework>=0.14.1", "pyarrow>=16.0"]
openai = ["openai>=1.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotmemory"]

[tool.hatch.build.targets.sdist]
only-include = ["src/hotmemory", "CHANGELOG.md", "LICENSE", "README.md"]

[dependency-groups]
dev = [
    "hotmemory[hotdata,openai]",
    "mypy",
    "pytest",
    "pytest-socket",
    "ruff",
    { include-group = "bench" },
]
bench = ["hotmemory[hotdata,openai]", "numpy", "tiktoken"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "skills/hotmemory/scripts", "bench"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "bench/tests"]
addopts = ["--strict-markers"]
markers = ["hotdata: runs against a Hotdata engine; skips unless HOTMEMORY_TEST_URL is set"]
