[project]
name = "hotmemory"
version = "0.0.0"
description = "Agent memory as tables on Hotdata"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
hotdata = ["hotdata-framework>=0.14.1", "pyarrow>=14.0"]
openai = ["openai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotmemory"]

[dependency-groups]
dev = ["hotmemory[hotdata,openai]", "mypy", "pytest", "pytest-socket", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "skills/hotmemory/scripts"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["hotdata: runs against a RuntimeDB engine; skips unless HOTMEMORY_TEST_URL is set"]
