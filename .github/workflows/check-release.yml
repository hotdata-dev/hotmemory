name: check-release

on:
  pull_request:
    paths:
      - pyproject.toml
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Check that a version change has a changelog section
        run: python3 scripts/changelog.py check "origin/$GITHUB_BASE_REF"
